name: legado-home-local

services:
  mysql:
    image: mysql:5.7
    container_name: legado-home-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: soumal
      MYSQL_USER: soumal
      MYSQL_PASSWORD: soumal
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - "3307:3306"
    volumes:
      - local-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpwd --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: legado-home-local-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    image: node:20-bookworm
    container_name: legado-home-local-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: soumal
      DB_PASSWORD: soumal
      DB_NAME: soumal
      DB_CONNECTION_LIMIT: 20
      JWT_SECRET: legado-web-secret-key-change-in-development
      JWT_EXPIRES_IN: 7d
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_EMAIL: admin@legado.local
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT: 1000
      SEARCH_CACHE_TTL_SECONDS: 600
      SEARCH_SOURCE_CONCURRENCY: 10
      SEARCH_GLOBAL_CONCURRENCY: 10
      ENABLE_SOURCE_JS: "false"
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGIN: "*"
      TZ: Asia/Shanghai
    volumes:
      - /mnt/c/Users/Administrator/legado-server:/app
      - /mnt/c/Users/Administrator/legado-server-data:/app/data
    ports:
      - "3001:3001"
    command: >
      sh -c "cd /app && npm install && npm run dev"

  web:
    image: nginx:1.27-alpine
    container_name: legado-home-local-web
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - /mnt/c/Users/Administrator/legado-web:/usr/share/nginx/html:ro
      - /mnt/c/Users/Administrator/legado-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5341:80"

volumes:
  local-mysql-data:
  local-redis-data:
